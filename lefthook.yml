# Git hooks for nib-git (versioned via lefthook).
# Run `make tools` once to install lefthook and wire the hooks.
#
# pre-commit runs the fast gate. The coverage gate (make cover) runs in CI,
# not here, to keep commits fast.

pre-commit:
  parallel: false
  commands:
    check:
      run: make check

pre-push:
  commands:
    cover:
      run: make cover
